
<!DOCTYPE html>
<html>
<head>
    <title>Employee Information</title>

    <style>
        body {
            font-family: Arial;
            text-align: center;
            background: #f2f2f2;
        }

        h2 {
            color: blue;
        }

        table {
            margin: auto;
            width: 70%;
            border-collapse: collapse;
            background: white;
        }

        th, td {
            border: 1px solid black;
            padding: 12px;
        }

        th {
            background: lightblue;
        }

        button {
            padding: 10px 20px;
            background: green;
            color: white;
            border: none;
            cursor: pointer;
        }
    </style>
</head>

<body>

    <h2>Employee Information</h2>

    <button onclick="loadXML()">Load Employee Data</button>

    <br><br>

    <table>
        <thead>
            <tr>
                <th>ID</th>
                <th>Name</th>
                <th>Department</th>
                <th>Salary</th>
            </tr>
        </thead>

        <tbody id="data"></tbody>
    </table>

    <script>
        function loadXML() {
            fetch("employee.xml")
            .then(response => response.text())
            .then(str => {
                let parser = new DOMParser();
                let xml = parser.parseFromString(str, "text/xml");

                let employees = xml.getElementsByTagName("employee");
                let output = "";

                for (let i = 0; i < employees.length; i++) {
                    output += "<tr>";

                    output += "<td>" +
                    employees[i].getElementsByTagName("id")[0].textContent +
                    "</td>";

                    output += "<td>" +
                    employees[i].getElementsByTagName("name")[0].textContent +
                    "</td>";

                    output += "<td>" +
                    employees[i].getElementsByTagName("department")[0].textContent +
                    "</td>";

                    output += "<td>" +
                    employees[i].getElementsByTagName("salary")[0].textContent +
                    "</td>";

                    output += "</tr>";
                }

                document.getElementById("data").innerHTML = output;
            });
        }
    </script>

</body>
</html>
